# Configuration file

general {
    # Log animation diagnostics. [default: false]
    B:debug=false

    # Master switch for all Smooth UI features. [default: true]
    B:enabled=true
}


hotbar {
    # Slide the hotbar selection box. [default: true]
    B:enabled=true

    # Hotbar selector speed. [range: 1.0 ~ 80.0, default: 35.0]
    S:speed=35.0
}


hover {
    # Fade between normal and hovered button sprites. [default: true]
    B:enabled=true

    # Slot highlight colour in 0xRRGGBB form. [range: 0 ~ 16777215, default: 16777215]
    I:slotColor=16777215

    # Enable the animated inventory slot highlight. [default: true]
    B:slotHighlight=true

    # Draw the slot highlight behind the item instead of in front. [default: true]
    B:slotHighlightBehindItem=true

    # Maximum opacity of the slot highlight. [range: 0.0 ~ 1.0, default: 0.5]
    S:slotOpacity=0.5

    # Slot highlight transition speed per tick. [range: 0.05 ~ 1.0, default: 0.35]
    S:slotSpeed=0.35

    # Button/slot transition speed per tick. Bigger = faster. [range: 0.05 ~ 1.0, default: 0.35]
    S:speed=0.35

    # Creative trash slot highlight colour. [range: 0 ~ 16777215, default: 16711680]
    I:trashColor=16711680
}


immersive {
    # Scale applied to the hovered slot item. [range: 1.0 ~ 1.25, default: 1.06]
    S:hoverItemScale=1.06

    # Spawn small rarity-coloured sparks around hovered items. [default: true]
    B:rarityParticles=true
}


screen {
    # Fade the dark menu background in. [default: true]
    B:backgroundFade=true

    # Background fade duration. [range: 0 ~ 800, default: 150]
    I:backgroundFadeMs=150

    # Opacity of the dark menu background. [range: 0.0 ~ 1.0, default: 0.65]
    S:backgroundOpacity=0.65

    # Screen slide distance in GUI pixels. [range: 0 ~ 40, default: 10]
    I:distance=10

    # Screen opening animation duration. [range: 0 ~ 800, default: 220]
    I:durationMs=220

    # Easing style: LINEAR, SINE, QUAD, CUBIC, BACK, ELASTIC. [default: BACK]
    S:easing=BACK

    # Slide newly opened screens into place. [default: true]
    B:enabled=true

    # Only animate inventory/container screens. [default: false]
    B:onlyContainers=false
}


scrolling {
    # Smooth scrolling for GuiSlot lists. [default: true]
    B:enabled=true

    # Higher = snappier scrolling. [range: 0.05 ~ 0.98, default: 0.8]
    S:friction=0.8

    # Allowed rubber-band distance in pixels. [range: 0.0 ~ 80.0, default: 0.0]
    S:overscroll=0.0

    # Mouse wheel multiplier. [range: 0.25 ~ 3.0, default: 1.0]
    S:sensitivity=1.0
}


swapping {
    # How much the item path bows sideways. [range: 0.0 ~ 1.0, default: 0.35]
    S:arc=0.35

    # Base duration of an item movement animation in milliseconds. [range: 80 ~ 800, default: 260]
    I:durationMs=260

    # Animate items moving between inventory slots. [default: true]
    B:enabled=true

    # Maximum simultaneous item movements. [range: 1 ~ 128, default: 32]
    I:maxAnimations=32
}


