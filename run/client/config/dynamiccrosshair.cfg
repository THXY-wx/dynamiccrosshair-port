# Configuration file

##########################################################################################################
# bobbing
#--------------------------------------------------------------------------------------------------------#
# Crosshair bobbing (CrosshairBobbingMod behaviour)
##########################################################################################################

bobbing {
    B:attack=true
    B:bow=true
    B:crossbowIndicator=true
    B:eat=true
    B:enabled=true
    B:itemSwitch=true
    B:placeFeedback=true
    B:sneak=true
    S:strength=1.0
    B:viewBobbing=true
}


##########################################################################################################
# compat
#--------------------------------------------------------------------------------------------------------#
# Compatibility with other crosshair mods
##########################################################################################################

compat {
    B:adoptSelectionColours=true
    B:adoptSelectionOutline=false
    S:crosshairSelection=AUTO
    S:interactableBlocks=
    S:nonInteractableBlocks=
    S:nonUsableItems=
    S:usableItems=
    B:useSelectionRenderer=true
}


##########################################################################################################
# dynamic
#--------------------------------------------------------------------------------------------------------#
# Which contexts change the crosshair
##########################################################################################################

dynamic {
    B:displayCorrectTool=true
    S:holdingBlock=IF_INTERACTABLE
    B:holdingMeleeWeapon=true
    B:holdingRangedWeapon=true
    B:holdingShield=true
    B:holdingThrowable=true
    B:holdingTool=true
    S:holdingUsableItem=IF_INTERACTABLE
    B:onBlock=true
    B:onEntity=true
    B:onInteractableBlock=true
}


##########################################################################################################
# general
#--------------------------------------------------------------------------------------------------------#
# General behaviour
##########################################################################################################

general {
    B:disableDebugCrosshair=false
    B:dynamicCrosshair=true
    B:enabled=true
    B:hideWithMap=true
    B:hideWithScreen=true
    B:thirdPersonCrosshair=false
}


##########################################################################################################
# style
#--------------------------------------------------------------------------------------------------------#
# Crosshair sprites: shape:argb:blend:coalesce:scale
##########################################################################################################

style {
    S:holdingBlock=diamond:0xFFFFFFFF:true:false:1.0
    S:holdingMeleeWeapon=cross_open:0xFFFFFFFF:true:true:1.0
    S:holdingRangedWeapon=cross_open_diagonal:0xFFFFFFFF:true:false:1.0
    S:holdingThrowable=circle_large:0xFFFFFFFF:true:true:1.0
    S:holdingTool=square:0xFFFFFFFF:true:true:1.0
    S:holdingUsableItem=brackets_round:0xFFFFFFFF:true:true:1.0
    S:interact=brackets:0xFFFFFFFF:true:true:1.0
    S:modifierCorrect=dot:0xFF55FF55:true:true:1.0
    S:modifierIncorrect=dot:0xFFFF5555:true:true:1.0
    S:onBlock=cross_open:0xFFFFFFFF:true:true:1.0
    S:onEntity=cross_open_diagonal:0xFFFFFFFF:true:true:1.0
    S:regular=cross_open:0xFFFFFFFF:true:true:1.0
    S:shield=brackets_bottom:0xFFFFFFFF:true:true:1.0
}


