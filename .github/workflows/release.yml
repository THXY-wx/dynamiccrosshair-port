name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches modVersion
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^modVersion *= *//p' gradle.properties | tr -d '[:space:]')"
          echo "tag=$tag modVersion=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $tag does not match modVersion $version in gradle.properties"
            exit 1
          fi

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Collect release jar
        shell: bash
        run: |
          mkdir -p dist
          find build/libs -maxdepth 1 -type f -name 'DynamicCrosshair-*.jar' \
            ! -name '*-dev.jar' ! -name '*-sources.jar' -exec cp {} dist/ \;
          if [ -z "$(ls -A dist)" ]; then
            echo "::error::no release jar found in build/libs"
            exit 1
          fi
          ls -lh dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true
          name: ${{ github.ref_name }}
