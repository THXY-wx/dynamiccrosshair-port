name: Build & Release

on:
  push:
    tags:
      - '*'          # any tag, e.g. 1.1.27 -> build and publish that version
  workflow_dispatch: # manual build from the Actions tab (artifact only, no release)

permissions:
  contents: write    # required to create the GitHub release

jobs:
  build:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gtnhgradle derives versions/data from tags/history
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version and verify tag
        shell: bash
        run: |
          version="$(sed -n 's/^modVersion *= *//p' gradle.properties | tr -d '[:space:]')"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "modVersion=$version"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            echo "tag=$tag"
            if [ "$tag" != "$version" ]; then
              echo "::error::tag $tag does not match modVersion $version in gradle.properties"
              exit 1
            fi
          fi

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Collect release jar
        shell: bash
        run: |
          mkdir -p dist
          jar="build/libs/DynamicCrosshair-1.7.10-$VERSION.jar"
          if [ ! -f "$jar" ]; then
            echo "::error::expected release jar not found: $jar"
            ls -l build/libs
            exit 1
          fi
          cp "$jar" dist/
          ls -lh dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dynamiccrosshair-jar
          path: dist/*.jar

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: dist/*.jar
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
